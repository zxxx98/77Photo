services:
  face-worker:
    build: .
    image: 77photo-face-worker:0.1.1
    platform: linux/amd64
    ports:
      - "${FACE_BIND_IP:?set Windows LAN IP}:8091:8091"
    environment:
      FACE_API_KEY: ${FACE_API_KEY:?set a random secret}
      FACE_MODEL_DIR: /models
    command: ["uvicorn", "app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8091", "--workers", "${FACE_WORKER_PROCESSES:-4}", "--no-access-log", "--timeout-keep-alive", "0"]
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: "no"
    mem_limit: 8g
    cpus: 8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
