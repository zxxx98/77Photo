openapi: 3.1.0
info:
  title: 77Photo API
  version: 1.0.0
  description: |
    V1 REST API for the filesystem-first 77Photo family photo service.
    All application endpoints use JSON unless stated otherwise. Timestamps are
    RFC 3339 UTC strings. The API never accepts a server filesystem path from a
    client; resources are addressed by opaque IDs. Authenticated application
    endpoints accept either cookieAuth or bearerAuth. Cookie-authenticated
    writes require X-CSRF-Token; Bearer clients must not send browser CSRF
    tokens. Mobile login and refresh return tokens in JSON and never set
    browser cookies.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: health
  - name: setup
  - name: auth
  - name: mobile
  - name: users
  - name: folders
  - name: photos
  - name: shares
  - name: share-links
  - name: map
  - name: admin
paths:
  /healthz:
    get:
      tags: [health]
      summary: Check service, database and storage availability
      operationId: health
      security: []
      responses:
        '200':
          description: All critical dependencies are available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: One or more critical dependencies are unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/setup/admin:
    post:
      tags: [setup]
      summary: Create the first administrator
      description: |
        The only unauthenticated write endpoint. It is available exactly once,
        while the database contains no users, and is intended to be called from
        a local trusted network during first startup. It returns 409 after the
        first user has been created.
      operationId: initializeAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupAdminRequest' }
      responses:
        '201':
          description: Administrator created and a session established
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Initialization has already completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Username or password does not satisfy policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/setup/status:
    get:
      tags: [setup]
      summary: Check whether first-run setup is required
      description: Returns only whether the installation has no users and still requires its first administrator.
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Current setup requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatusResponse' }
        '500':
          description: Setup state could not be determined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Start a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-CSRF-Token:
              $ref: '#/components/headers/CSRFToken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials (same response for unknown or disabled users)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: username or password is incorrect
                  request_id: req_01JABC
        '429':
          description: Login rate limit exceeded
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFForbidden' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Return the current account
      operationId: me
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          headers:
            X-CSRF-Token:
              $ref: '#/components/headers/CSRFToken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change the current user's password
      description: |
        Requires the current password. On success every other browser session
        and mobile device of the user is signed out; the calling session or
        device stays signed in. Repeated wrong current passwords are rate
        limited per user.
      operationId: changePassword
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed; other sessions and devices revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFForbidden' }
        '422':
          description: CURRENT_PASSWORD_INCORRECT when the current password is wrong (not 401, so clients keep the session), or PASSWORD_INVALID when the new password is not 12-256 characters
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: Too many wrong current passwords (LOGIN_RATE_LIMITED)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/mobile/auth/login:
    post:
      tags: [mobile]
      summary: Start a mobile token session
      description: |
        Authenticates a mobile client and registers the supplied device. The
        response contains opaque access and refresh tokens. This endpoint never
        sets browser cookies; mobile clients should store tokens in platform
        secure storage.
      operationId: mobileLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileLoginRequest' }
      responses:
        '200':
          description: Mobile tokens and the registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Credentials or device fields do not satisfy policy
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: Login rate limit exceeded
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/mobile/auth/refresh:
    post:
      tags: [mobile]
      summary: Rotate mobile access and refresh tokens
      description: |
        Rotates a refresh-token family and returns replacement tokens. This
        endpoint never sets browser cookies; mobile clients should replace the
        stored token pair atomically.
      operationId: mobileRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileRefreshRequest' }
      responses:
        '200':
          description: Rotated mobile tokens and the registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mobile/auth/logout:
    post:
      tags: [mobile]
      summary: Revoke the current mobile device
      description: Revokes the current device and its mobile token family. Bearer clients must not send browser CSRF tokens.
      operationId: mobileLogout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Mobile device and its tokens revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mobile/devices:
    get:
      tags: [mobile]
      summary: List the current user's mobile devices
      description: Returns devices registered to the account identified by the Bearer token, including revoked devices.
      operationId: listMobileDevices
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registered mobile devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MobileDevice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mobile/devices/{id}:
    parameters:
      - $ref: '#/components/parameters/MobileDeviceID'
    delete:
      tags: [mobile]
      summary: Revoke a mobile device
      description: Revokes the selected device and all of its mobile tokens. Bearer clients must not send browser CSRF tokens.
      operationId: revokeMobileDevice
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Mobile device and its tokens revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      operationId: listUsers
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Includes deleted (tombstoned) accounts with deleted_at set; clients normally hide them.
      responses:
        '200':
          description: Users without password hashes or session secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
    post:
      tags: [users]
      summary: Create a user
      operationId: createUser
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '409':
          description: Username already belongs to an existing account (USERNAME_TAKEN). Usernames of deleted accounts are free for reuse.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422': { $ref: '#/components/responses/InvalidCredentials' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [users]
      summary: Update username, role, password or active state
      operationId: updateUser
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Operation would remove the last active administrator (LAST_ADMIN) or the username is taken (USERNAME_TAKEN)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      tags: [users]
      summary: Delete a user while retaining or transferring their photos
      description: |
        retain keeps the account as a tombstone that still owns its photos and
        frees the username for reuse. transfer moves every file under the
        user's storage root into the recipient's root (clashing names get a
        " (2)" style suffix), rewrites folder and photo paths, hands ownership
        to the recipient and removes the account. A transfer holds the shared
        maintenance lock and is rolled back on disk if it fails.
      operationId: deleteUser
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteUserRequest' }
      responses:
        '204': { description: User deleted; photos are retained or transferred according to photo_action }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Last active administrator cannot be deleted (LAST_ADMIN), or a transfer was requested while another maintenance task runs (MAINTENANCE_IN_PROGRESS, see MaintenanceConflict)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: A transfer target is required or invalid
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/folders:
    get:
      tags: [folders]
      summary: List folders visible to the current user
      operationId: listFolders
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParentFolderID'
      responses:
        '200':
          description: Direct children of the selected root
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Folder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [folders]
      summary: Create a folder
      operationId: createFolder
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
      responses:
        '201':
          description: Folder created
          content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: A sibling folder has the same name
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/folders/{id}:
    parameters:
      - $ref: '#/components/parameters/FolderID'
    get:
      tags: [folders]
      summary: Get folder details
      operationId: getFolder
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Folder details and visible child counts
          content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [folders]
      summary: Rename a folder
      operationId: renameFolder
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameRequest' } } }
      responses:
        '200':
          description: Renamed folder
          content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: Sibling name conflict
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      tags: [folders]
      summary: Permanently delete an empty folder
      operationId: deleteFolder
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Empty folder deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: Folder is not empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: FOLDER_NOT_EMPTY
                  message: folder must be empty before deletion
                  request_id: req_01JABC

  /api/v1/folders/{id}/move:
    post:
      tags: [folders]
      summary: Move a folder within an authorized tree
      operationId: moveFolder
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MoveRequest' } } }
      responses:
        '200':
          description: Moved folder
          content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: Target conflict or target is a descendant of the source
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/photos:
    get:
      tags: [photos]
      summary: List photos with stable cursor pagination
      operationId: listPhotos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FolderFilter'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Trimmed filename substring, 100 Unicode characters maximum. ASCII letters match without case; non-ASCII characters match exactly. Percent and underscore are literal characters. Empty or whitespace-only values disable this filter.
        - name: media_type
          in: query
          required: false
          schema: { type: string, enum: [photo, video] }
          description: Photo includes still and Live Photos; video includes standalone videos. Omit for all media.
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/BBoxFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Photos sorted by captured_at DESC then id DESC
          content: { application/json: { schema: { $ref: '#/components/schemas/PhotoPage' } } }
        '400':
          description: Invalid timestamp, bounding box, cursor, or incompatible filters
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '410':
          description: Cursor has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: CURSOR_EXPIRED
                  message: cursor expired; restart pagination without cursor
                  request_id: req_01JABC

  /api/v1/photos/shared/{folderId}/:
    get:
      tags: [photos]
      summary: List photos in a shared folder subtree
      operationId: listSharedPhotos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SharedFolderID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Shared photos visible to the caller
          content: { application/json: { schema: { $ref: '#/components/schemas/PhotoPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/photos/upload:
    post:
      tags: [photos]
      summary: Upload one photo or video
      description: |
        Each request contains exactly one file. Clients performing batch upload
        send independent requests and may limit concurrency. The server streams
        the body to a temporary file, validates content, fsyncs and atomically
        renames it before creating the index row.
      operationId: uploadPhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, folder_id]
              properties:
                file:
                  type: string
                  format: binary
                folder_id:
                  $ref: '#/components/schemas/ID'
                conflict:
                  type: string
                  enum: [reject, rename]
                  default: reject
                file_modified_at:
                  type: string
                  format: date-time
                  description: Optional client-side original file modification time used only when embedded capture metadata is unavailable
      responses:
        '201':
          description: File stored and indexed
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: Duplicate content or name conflict
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: File exceeds PHOTO_MAX_UPLOAD_SIZE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: UPLOAD_TOO_LARGE
                  message: upload exceeds the configured maximum size
                  request_id: req_01JABC
        '415':
          description: Unsupported or content-type-mismatched media
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: Invalid or unsafe media (including excessive pixel count)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/photos/live-upload:
    post:
      tags: [photos]
      summary: Upload one still image and an optional motion companion atomically
      description: |
        The still part is required and the motion part is optional. The request
        creates one Photo row. Supported stills are JPEG, PNG, HEIC and HEIF;
        an explicit motion companion must be a validated QuickTime MOV. Scalar
        fields must precede file parts: folder_id, conflict, file_modified_at, file, motion.
        MVIMG and HEIC/HEIF files with embedded motion are accepted as a single
        still file and are inspected by bytes after storage.
      operationId: uploadLivePhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, folder_id]
              properties:
                folder_id: { $ref: '#/components/schemas/ID' }
                conflict: { type: string, enum: [reject, rename], default: reject }
                file_modified_at: { type: string, format: date-time, description: Optional client-side original file modification time used only when embedded capture metadata is unavailable }
                file: { type: string, format: binary, description: JPEG, PNG, HEIC or HEIF still image }
                motion: { type: string, format: binary, description: Optional same-basename QuickTime MOV companion }
      responses:
        '201':
          description: One still photo stored and indexed, with a validated motion artifact when supplied
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409': { description: Duplicate content or name conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '413': { description: Still or motion part exceeds PHOTO_MAX_UPLOAD_SIZE, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '415': { description: Unsupported, malformed or content-type-mismatched media, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Invalid or unsafe media, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/live-photos/status:
    get:
      tags: [photos]
      summary: Return the visible photo IDs with motion companions
      operationId: listLivePhotoStatus
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: ids
          in: query
          required: false
          schema: { type: string, description: Comma-separated photo IDs, maximum 100 }
      responses:
        '200':
          description: IDs that have a validated motion artifact
          content: { application/json: { schema: { $ref: '#/components/schemas/LivePhotoStatus' } } }
        '400': { description: More than 100 IDs or malformed query, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/live-photos/{id}:
    get:
      tags: [photos]
      summary: Stream an authenticated motion-photo companion
      operationId: getLivePhotoMotion
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '200':
          description: Inline motion bytes; the Content-Type reflects the stored MP4, WebM or QuickTime container
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
        '206':
          description: Partial motion bytes for range playback
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/photos/{id}:
    parameters:
      - $ref: '#/components/parameters/PhotoID'
    get:
      tags: [photos]
      summary: Get photo metadata
      operationId: getPhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Photo metadata; no media bytes are included
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [photos]
      summary: Rename a photo
      operationId: renamePhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameRequest' } } }
      responses:
        '200':
          description: Renamed photo metadata
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409': { $ref: '#/components/responses/NameConflict' }
    delete:
      tags: [photos]
      summary: Move a photo and motion originals to trash after confirmation
      operationId: deletePhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - name: confirm
          in: query
          required: true
          schema: { type: boolean, const: true }
          description: Must be exactly true; clients must show a second confirmation step.
      responses:
        '204': { description: 'Photo hidden; originals retained in trash for recovery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Explicit confirmation missing
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/photos/{id}/move:
    post:
      tags: [photos]
      summary: Move a photo to another authorized folder
      operationId: movePhoto
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MoveRequest' } } }
      responses:
        '200':
          description: Moved photo metadata
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409': { $ref: '#/components/responses/NameConflict' }

  /api/v1/photos/{id}/thumbnail:
    get:
      tags: [photos]
      summary: Read or queue a WebP thumbnail
      operationId: getThumbnail
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - name: size
          in: query
          required: true
          schema: { type: integer, enum: [256, 512, 1280] }
      responses:
        '200':
          description: Cached WebP thumbnail
          headers:
            Cache-Control: { schema: { type: string }, description: Private cache keyed to the session and source revision. }
            ETag: { schema: { type: string } }
          content: { image/webp: { schema: { type: string, format: binary } } }
        '202':
          description: Thumbnail queued; caller should use placeholder and retry
          content: { application/json: { schema: { $ref: '#/components/schemas/ThumbnailPending' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/photos/{id}/preview:
    get:
      tags: [photos]
      summary: Read the 1280px preview or an original video stream
      operationId: getPreview
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '200':
          description: Preview bytes with a private cache policy
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        '206':
          description: Partial video response for browser Range playback
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Invalid byte range
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/photos/{id}/original:
    get:
      tags: [photos]
      summary: Download the original file
      operationId: getOriginal
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=\\d*-\\d*$' }
          description: Byte range used for browser video playback.
      responses:
        '200':
          description: Complete original bytes
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [private, 'no-store'] } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '206':
          description: Partial original video bytes
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Invalid byte range
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/map/config:
    get:
      tags: [map]
      summary: Describe the base map clients should draw
      description: |
        Returns `{"enabled": false}` until the deployment sets
        `PHOTO_MAP_TIANDITU_KEY`. When enabled, `tile_layers` are stacked in
        order (Tianditu vector base map, then Chinese labels, Web Mercator).
        Tile URLs carry the browser key, so the response is only sent to
        signed-in clients and is not cached.
      operationId: getMapConfig
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current base map configuration
          content: { application/json: { schema: { $ref: '#/components/schemas/MapConfig' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/map/points:
    get:
      tags: [map]
      summary: List every visible photo that has a capture position
      description: |
        Uses the same visibility rules as `GET /api/v1/photos`: members see
        their own photos and shared folders, administrators see every photo.
        Deleted, missing and paired motion files are excluded. The whole set
        is returned at once, newest first, so clients can cluster and filter
        locally. Responses are gzip-compressed when accepted and revalidated
        with a weak ETag.
      operationId: listMapPoints
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Located photos in captured_at DESC, id DESC order
          headers:
            ETag: { schema: { type: string }, description: Weak validator of the response body }
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPoints' } } }
        '304': { description: The client's cached points are current }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/share-links:
    get:
      tags: [share-links]
      summary: List share links manageable by the current user
      description: Current resource ownership determines access. Administrators also see orphan records. Tokens and password hashes are never returned.
      operationId: listManagedShareLinks
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, expired, revoked, unavailable] } }
        - { name: resource_type, in: query, schema: { type: string, enum: [photo, folder] } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque page cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Share links sorted by creation time, newest first
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedSharePage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid filter or cursor, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/me/share-links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [share-links]
      summary: Revoke a managed share link
      description: Idempotent for accessible links. Clears outstanding password unlock sessions. Cookie writes require CSRF.
      operationId: revokeManagedShareLink
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Link revoked or already revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token for cookie authentication }
        '404': { description: Link absent or inaccessible }

  /api/v1/share-links:
    post:
      tags: [share-links]
      summary: Create a read-only public link for a photo or folder
      description: |
        The caller must own the resource or be an administrator. The returned
        URL is a hash route such as /#/share/{token}; the token is never stored
        in plaintext by the server. A password is optional. Duration is one of
        1_day, 7_days, or forever.
      operationId: createShareLink
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShareLinkRequest' }
      responses:
        '201':
          description: Public link created; recipients can only view scoped previews
          content: { application/json: { schema: { $ref: '#/components/schemas/ShareLink' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ShareManageForbidden' }
        '422':
          description: Resource, duration, or optional password is invalid
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/share-links/{token}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      tags: [share-links]
      summary: Read public share metadata
      operationId: getPublicShare
      security: []
      responses:
        '200':
          description: Shared resource name, type, password state and expiry
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicShare' } } }
        '404': { $ref: '#/components/responses/ShareUnavailable' }

  /api/v1/share-links/{token}/unlock:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    post:
      tags: [share-links]
      summary: Unlock a password-protected public link
      operationId: unlockPublicShare
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnlockShareRequest' }
      responses:
        '200':
          description: Link unlocked for this browser session
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ShareAccessCookie'
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicShare' } } }
        '401':
          description: Password is required or incorrect
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404': { $ref: '#/components/responses/ShareUnavailable' }

  /api/v1/share-links/{token}/photos:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      tags: [share-links]
      summary: List photos in a public share scope
      operationId: listPublicSharePhotos
      security: []
      responses:
        '200':
          description: One photo for a photo link, or all non-deleted descendant photos for a folder link
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicPhotoPage' } } }
        '401':
          description: Password-protected link has not been unlocked
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404': { $ref: '#/components/responses/ShareUnavailable' }

  /api/v1/share-links/{token}/photos/{photoId}/preview:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
      - name: photoId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      tags: [share-links]
      summary: Read a scoped 1280px image preview or inline video stream
      operationId: getPublicSharePreview
      security: []
      responses:
        '200':
          description: Read-only preview; no original-download endpoint exists for public links
          headers:
            Content-Disposition:
              schema: { type: string, pattern: '^inline' }
          content:
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        '202':
          description: Image preview is queued
          content: { application/json: { schema: { $ref: '#/components/schemas/ThumbnailPending' } } }
        '401': { $ref: '#/components/responses/SharePasswordRequired' }
        '404': { $ref: '#/components/responses/ShareUnavailable' }

  /api/v1/shares:
    get:
      tags: [shares]
      summary: Legacy member ACL shares (no longer shown in the Web UI)
      operationId: listShares
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Share records without secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Share' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [shares]
      summary: Legacy member ACL share (no longer shown in the Web UI)
      operationId: createShare
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateShareRequest' } } }
      responses:
        '201':
          description: Share created
          content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ShareManageForbidden' }
        '409':
          description: Same folder is already shared with the user
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/shares/{id}:
    delete:
      tags: [shares]
      summary: Revoke a legacy member ACL share
      operationId: revokeShare
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Share revoked; inherited access ends immediately }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ShareManageForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/rescan:
    post:
      tags: [admin]
      summary: Start a filesystem rescan
      operationId: startRescan
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '202':
          description: Scan queued
          content: { application/json: { schema: { $ref: '#/components/schemas/RescanJob' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '409':
          description: A rescan is already queued or running (RESCAN_IN_PROGRESS, details.job_id), or another maintenance task holds the lock (MAINTENANCE_IN_PROGRESS)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/admin/rescan/reset:
    post:
      tags: [admin]
      summary: Rebuild thumbnails and refresh metadata while retaining stable IDs
      description: |
        Retains photo IDs, trash records, photo shares and motion originals.
        Clears rebuildable thumbnails and runs a normal metadata rescan.
        Pending trash recovery blocks startup. Cache cleanup errors are reported
        on the job. Progress is read from GET /api/v1/admin/rescan/{jobId}.
      operationId: resetLibraryIndex
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
      responses:
        '202':
          description: Reset queued
          content: { application/json: { schema: { $ref: '#/components/schemas/RescanJob' } } }
        '400':
          description: confirm was missing or false (RESET_CONFIRM_REQUIRED)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '409': { $ref: '#/components/responses/MaintenanceConflict' }

  /api/v1/admin/rescan/{jobId}:
    get:
      tags: [admin]
      summary: Get rescan progress and result
      operationId: getRescan
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          description: Current or completed scan status
          content: { application/json: { schema: { $ref: '#/components/schemas/RescanJob' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/maintenance:
    get:
      tags: [admin]
      summary: Get the maintenance task currently holding the lock
      description: |
        Rescan/reset, thumbnail rebuild, import, broken photo cleanup and user
        photo transfer share one server-side lock, so at most one runs at a
        time. Clients use this endpoint to re-attach to a running job after a
        reload (job_id is set for rescan, thumbnail_rebuild and import) and
        after receiving MAINTENANCE_IN_PROGRESS.
      operationId: getMaintenance
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Active maintenance task, or null when idle
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceStatus' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /api/v1/admin/thumbnails/rebuild:
    post:
      tags: [admin]
      summary: Start a thumbnail rebuild
      description: |
        incremental only renders photos with a missing variant. full re-renders
        every supported photo and video, replacing variants in place so a
        failed render keeps the existing thumbnails, and prunes cached variants
        of older source revisions. Original media is never modified.
      operationId: startThumbnailRebuild
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThumbnailRebuildRequest' }
      responses:
        '202':
          description: Rebuild queued
          content: { application/json: { schema: { $ref: '#/components/schemas/ThumbnailRebuildJob' } } }
        '400':
          description: Invalid JSON (INVALID_REQUEST) or unknown mode (INVALID_REBUILD_MODE)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '409':
          description: A rebuild is already running (THUMBNAIL_REBUILD_IN_PROGRESS, details.job_id), or another maintenance task holds the lock (MAINTENANCE_IN_PROGRESS)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/admin/thumbnails/rebuild/{jobId}:
    get:
      tags: [admin]
      summary: Get thumbnail rebuild progress and result
      operationId: getThumbnailRebuild
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          description: Current or completed rebuild status
          content: { application/json: { schema: { $ref: '#/components/schemas/ThumbnailRebuildJob' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/photos/cleanup:
    get:
      tags: [admin]
      summary: Scan for clearly broken photos
      description: |
        Reports indexed photos whose original is missing or zero bytes. A photo
        is only reported missing when its library root (users/{id} or
        shared/{id}) is present, so an unmounted volume never looks like mass
        deletion; such photos and unreadable entries are counted in skipped.
        The scan is synchronous and holds the maintenance lock while it runs.
      operationId: scanBrokenPhotos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Scan result; nothing is deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/BrokenPhotoScanResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/MaintenanceConflict' }
    post:
      tags: [admin]
      summary: Permanently delete confirmed broken photos
      description: |
        Deletes only the IDs the administrator confirmed from a previous scan,
        and only if each is still clearly broken now. IDs that are no longer
        broken or no longer exist are reported in failures and left untouched.
      operationId: cleanupBrokenPhotos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrokenPhotoCleanupRequest' }
      responses:
        '200':
          description: Cleanup result
          content: { application/json: { schema: { $ref: '#/components/schemas/BrokenPhotoCleanupResult' } } }
        '400':
          description: Invalid JSON (INVALID_REQUEST)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '409': { $ref: '#/components/responses/MaintenanceConflict' }
        '422':
          description: confirm was not true or ids was empty (CONFIRMATION_REQUIRED), or more than 10000 ids (BATCH_TOO_LARGE)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/admin/imports:
    post:
      tags: [admin]
      summary: Move loose files from the photo root into a user's library
      description: |
        source_path is the one client-supplied filesystem location in the API.
        It must be relative to the photo root, must not contain "..", absolute
        paths, backslashes or NUL, must not start with users/, shared/ or a
        dot directory, and no component may be a symlink. "." imports root
        files outside users/, shared/ and hidden directories. Files move to
        users/{user_id}/Imported, keeping subfolders or, with
        organize_by_date, as Imported/YYYY/MM/DD using the timeline capture
        date. Existing destination files are never overwritten. Moved files
        are indexed by a follow-up rescan before the job completes.
      operationId: startImport
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '202':
          description: Import queued
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } }
        '400':
          description: Invalid JSON (INVALID_JSON) or rejected source directory (INVALID_IMPORT_SOURCE)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOrCSRFForbidden' }
        '404':
          description: Target user does not exist, is disabled or deleted (USER_NOT_FOUND)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: An import is already running (IMPORT_IN_PROGRESS), or another maintenance task holds the lock (MAINTENANCE_IN_PROGRESS)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/admin/imports/{jobId}:
    get:
      tags: [admin]
      summary: Get import progress and result
      operationId: getImport
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          description: Current or completed import status
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/faces/config:
    get:
      tags: [admin]
      summary: Get face worker availability without revealing its token
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Administrator face settings
          content:
            application/json:
              schema:
                type: object
                required: [enabled, configured, automatic_matching, match_threshold, match_margin, concurrency]
                properties:
                  enabled: { type: boolean }
                  configured: { type: boolean }
                  automatic_matching: { type: boolean }
                  match_threshold: { type: number, minimum: 0, maximum: 1 }
                  match_margin: { type: number, minimum: 0, maximum: 1 }
                  concurrency: { type: integer, minimum: 1, maximum: 8 }
  /api/v1/admin/faces/test:
    post:
      tags: [admin]
      summary: Test the configured Windows GPU worker and model compatibility
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Worker profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceWorkerProfile' }
        '503': { description: Worker unavailable or incompatible }
  /api/v1/admin/faces/jobs:
    get:
      tags: [admin]
      summary: List recent face scan jobs
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Up to 30 recent jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FaceJob' }
    post:
      tags: [admin]
      summary: Start a manual face scan
      description: Idempotency-Key must be unique per user action and is reused on retry.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [incremental, retry_failed, regroup, full], default: incremental }
                folder_id: { type: string, description: Optional folder and descendants for incremental/retry_failed only }
      responses:
        '200':
          description: Existing or newly started job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceJob' }
        '409': { description: Another face or maintenance job is active }
  /api/v1/admin/faces/jobs/{jobId}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Read a persisted face scan job
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Job state and counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceJob' }
  /api/v1/admin/faces/jobs/{jobId}/{action}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: { type: string }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [pause, resume, cancel] }
    post:
      tags: [admin]
      summary: Pause, resume or cancel a face scan
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceJob' }
        '409': { description: Invalid transition or maintenance conflict }
  /api/v1/admin/faces/jobs/{jobId}/failed:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List failed face scan photos and reason codes
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Up to 100 failed photos per page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        photo_id: { type: string }
                        filename: { type: string }
                        error: { type: string }
                  next_cursor: { type: string }
  /api/v1/admin/people:
    get:
      tags: [admin]
      summary: List people with valid photos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Page of people
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FacePerson' }
                  next_cursor: { type: string }
  /api/v1/admin/people/{personId}:
    parameters:
      - in: path
        name: personId
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      summary: Rename a person with revision check
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, revision]
              properties:
                name: { type: string, maxLength: 80 }
                revision: { type: integer }
      responses:
        '200': { description: Name saved }
        '409': { description: Stale revision }
  /api/v1/admin/people/{personId}/faces:
    parameters:
      - in: path
        name: personId
        required: true
        schema: { type: string, description: Use unassigned for low quality or ignored faces }
    get:
      tags: [admin]
      summary: List a person's detected faces and photos
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Page of face records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DetectedFace' }
                  next_cursor: { type: string }
  /api/v1/admin/people/{personId}/similar:
    parameters:
      - in: path
        name: personId
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Suggest up to five similar people from saved face vectors
      description: Read-only suggestions within the same photo owner; similarity is not an identity decision.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Possible matches ordered by cosine similarity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        person: { $ref: '#/components/schemas/FacePerson' }
                        score: { type: number, minimum: 0, maximum: 1 }
  /api/v1/admin/people/{personId}/merge:
    parameters:
      - in: path
        name: personId
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Merge source person into this person
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, revision, source_revision]
              properties:
                source_id: { type: string }
                revision: { type: integer }
                source_revision: { type: integer }
      responses:
        '200': { description: Merged within the same owner namespace }
        '409': { description: Stale revision or different owner }
  /api/v1/admin/faces/{faceId}:
    parameters:
      - in: path
        name: faceId
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      summary: Reassign or ignore a detected face
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                person_id: { type: string, description: Empty string creates a new person }
                ignored: { type: boolean }
                revision: { type: integer }
      responses:
        '200': { description: Face updated }
        '409': { description: Stale revision }
  /api/v1/admin/faces/{faceId}/thumbnail:
    parameters:
      - in: path
        name: faceId
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Download an administrator-only face crop
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: JPEG face crop
          content:
            image/jpeg:
              schema: { type: string, format: binary }

  /api/v1/trash/photos:
    get:
      tags: [photos]
      summary: List the current owner's trash, or all owners for administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
        - { name: cursor, in: query, schema: { type: string }, description: Signed cursor bound to principal and scope }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Private non-cacheable page
          content: { application/json: { schema: { $ref: '#/components/schemas/TrashPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }

  /api/v1/trash/photos/{id}/restore:
    post:
      tags: [photos]
      summary: Restore originals with stable photo ID; original-owner folder only
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrashRestoreRequest' } } }
      responses:
        '200':
          description: Operation results; batch failures are reported per item
          content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/{id}:
    delete:
      tags: [photos]
      summary: Permanently delete originals; owners and administrators only
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - $ref: '#/components/parameters/CSRFHeader'
        - { name: confirm, in: query, required: true, schema: { type: boolean, const: true } }
      responses:
        '204': { description: Completed; repeated permanent deletion of a missing item also succeeds }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/{id}/retry:
    post:
      tags: [photos]
      summary: Retry a journaled file operation; owners and administrators only
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Completed; repeated permanent deletion of a missing item also succeeds }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/{id}/preview:
    get:
      tags: [photos]
      summary: Read a private thumbnail; owners and administrators only
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoID'
      responses:
        '200':
          description: Private WebP thumbnail; Cache-Control no-store
          content: { image/webp: { schema: { type: string, format: binary } } }
        '202': { description: Thumbnail generation queued; retry later }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/batch-restore:
    post:
      tags: [photos]
      summary: Restore up to 500 selected items with per-item results
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchRestoreRequest' } } }
      responses:
        '200':
          description: Operation results; batch failures are reported per item
          content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchResult' } } }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/batch-delete:
    post:
      tags: [photos]
      summary: Permanently delete up to 500 selected items with confirmation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchDeleteRequest' } } }
      responses:
        '200':
          description: Operation results; batch failures are reported per item
          content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchResult' } } }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/trash/photos/empty:
    post:
      tags: [photos]
      summary: Purge up to 100 ready items at or before a fixed deletion cutoff
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrashEmptyRequest' } } }
      responses:
        '200':
          description: Operation results; batch failures are reported per item
          content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchResult' } } }
        '400': { description: Invalid request or cursor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NAME_CONFLICT, SOURCE_CHANGED, TRASH_RECOVERY_REQUIRED or MAINTENANCE_IN_PROGRESS' }
        '422': { description: Explicit destructive confirmation missing }

  /api/v1/photos/batch-delete:
    post:
      tags: [photos]
      summary: Move up to 500 authorized photos to trash
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrashBatchDeleteRequest' } } }
      responses:
        '200':
          description: deleted_ids contains photos moved to trash; failed contains per-item errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_ids: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: object, properties: { id: { type: string }, code: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '422': { description: Confirmation missing }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: 77photo_session
      description: HttpOnly server-side session cookie; never store in localStorage.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque short-lived mobile access token. Store it only in platform secure storage.
  headers:
    SessionCookie:
      schema: { type: string }
      description: HttpOnly session cookie. Secure is set in production.
    CSRFToken:
      schema: { type: string }
      description: Opaque token returned to the client and required on cookie-authenticated writes.
    RetryAfter:
      schema: { type: integer, minimum: 1 }
      description: Seconds until another login attempt may be made.
    ShareAccessCookie:
      schema: { type: string }
      description: HttpOnly, SameSite=Lax browser cookie scoped to this public-link token; it contains an opaque unlock token.
  parameters:
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string, minLength: 16 }
      description: Required for cookieAuth writes; Bearer clients must not send browser CSRF tokens.
    MobileDeviceID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    UserID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    FolderID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    SharedFolderID:
      name: folderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    PhotoID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    ParentFolderID:
      name: parent_id
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ID' }
      description: Omit for the caller's private root; use a folder ID for direct children.
    FolderFilter:
      name: folder_id
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ID' }
      description: Includes the selected folder subtree. Omit to list all visible photos.
    FromFilter:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Inclusive captured_at lower bound; timestamp must include a timezone.
    ToFilter:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Exclusive captured_at upper bound; timestamp must include a timezone.
    BBoxFilter:
      name: bbox
      in: query
      required: false
      schema: { type: string, example: '121.3,31.1,121.6,31.4' }
      description: |
        Only photos whose capture position lies inside `west,south,east,north`
        (degrees, WGS-84). West greater than east selects a box that crosses
        the antimeridian. Photos without a position never match. The box is
        bound into the pagination cursor like the other filters.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 16 }
      description: Opaque signed cursor valid for 15 minutes and bound to filters and user.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
  responses:
    Unauthorized:
      description: Missing, expired, revoked or disabled session
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AdminRequired:
      description: Current user is not an administrator
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    WriteForbidden:
      description: Caller has no write permission for this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: WRITE_FORBIDDEN
              message: read-only members cannot modify shared resources
              request_id: req_01JABC
    ReadForbidden:
      description: Caller has no read permission for this resource
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CSRFForbidden:
      description: Missing or invalid CSRF token on a cookie-authenticated write; Bearer requests do not use browser CSRF tokens.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AdminOrCSRFForbidden:
      description: Caller is not an administrator, or a cookie-authenticated write has a missing or invalid CSRF token. Bearer requests do not use browser CSRF tokens.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ShareManageForbidden:
      description: Caller does not own the folder and is not an administrator
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ShareUnavailable:
      description: Link is malformed, missing, expired, revoked, deleted or outside its scope
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    SharePasswordRequired:
      description: Link requires a successful password unlock in this browser
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NameConflict:
      description: Destination already contains a different item with this name
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InvalidCredentials:
      description: USERNAME_INVALID (username must be 1-64 printable characters after trimming) or PASSWORD_INVALID (password must be 12-256 characters)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    MaintenanceConflict:
      description: Another maintenance task holds the shared lock (MAINTENANCE_IN_PROGRESS). details.kind names the running task and details.job_id is set when it has a job; see GET /api/v1/admin/maintenance.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: MAINTENANCE_IN_PROGRESS
              message: another maintenance task is queued or running
              request_id: req_01JABC
              details: { kind: import, job_id: import_1758873600000000000 }
  schemas:

    TrashItem:
      type: object
      required: [id, owner_id, filename, mime_type, size, folder_id, folder_name, deleted_at, expires_at, state, recovery_required]
      properties:
        id: { type: string }
        owner_id: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size: { type: integer, format: int64 }
        folder_id: { type: string }
        folder_name: { type: string }
        deleted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [moving, trashed, restoring, purging] }
        recovery_required: { type: boolean }
    TrashPage:
      type: object
      required: [items, next_cursor, retention_days]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TrashItem' } }
        next_cursor: { type: [string, 'null'] }
        retention_days: { type: integer, default: 30 }
    TrashRestoreRequest:
      type: object
      properties:
        folder_id: { type: string, description: Optional folder belonging to the same photo owner }
        conflict: { type: string, enum: [reject, rename], default: reject }
    TrashBatchRestoreRequest:
      allOf:
        - $ref: '#/components/schemas/TrashRestoreRequest'
        - type: object
          required: [ids]
          properties:
            ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
    TrashBatchDeleteRequest:
      type: object
      required: [ids, confirm]
      properties:
        ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
        confirm: { type: boolean, const: true }
    TrashEmptyRequest:
      type: object
      required: [scope, before, confirm]
      properties:
        scope: { type: string, enum: [mine, all], description: All requires administrator role }
        before: { type: string, format: date-time, description: Reuse the same cutoff while has_more is true; pending entries are retained }
        confirm: { type: boolean, const: true }
    TrashBatchResult:
      type: object
      required: [completed_ids, failed]
      properties:
        completed_ids: { type: array, items: { type: string } }
        failed:
          type: array
          items:
            type: object
            required: [id, code]
            properties:
              id: { type: string }
              code: { type: string }
        has_more: { type: boolean }
    FaceWorkerProfile:
      type: object
      required: [api_version, pipeline_id, embedding_model_id, embedding_dim, device]
      properties:
        api_version: { type: string }
        pipeline_id: { type: string }
        embedding_model_id: { type: string }
        embedding_dim: { type: integer }
        device: { type: string, enum: [cuda] }
    FaceJob:
      type: object
      required: [id, mode, status, error, created_at, updated_at, counts]
      properties:
        id: { type: string }
        mode: { type: string, enum: [incremental, retry_failed, regroup, full] }
        status: { type: string, enum: [running, paused, paused_offline, completed, completed_with_errors, failed, cancelled] }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            total: { type: integer }
            pending: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            cancelled: { type: integer }
    FacePerson:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        revision: { type: integer }
        photo_count: { type: integer }
        cover_face_id: { type: string }
    DetectedFace:
      type: object
      properties:
        id: { type: string }
        photo_id: { type: string }
        owner_id: { type: string }
        person_id: { type: string }
        filename: { type: string }
        revision: { type: integer }
        ignored: { type: boolean }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
    ID:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
      description: Opaque server-generated identifier.
    Role:
      type: string
      enum: [admin, user]
    Permission:
      type: string
      enum: [read, write]
    User:
      type: object
      required: [id, username, role, is_active, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: For deleted accounts this is the name the account had; the name itself is free for reuse.
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
    SetupStatusResponse:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    MobileLoginRequest:
      type: object
      required: [username, password, device_name, platform, app_version]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        device_name: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string, minLength: 1, maxLength: 64 }
    MobileRefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 1 }
    MobileSessionResponse:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, device, user]
      properties:
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
        device: { $ref: '#/components/schemas/MobileDevice' }
        user: { $ref: '#/components/schemas/User' }
    MobileDevice:
      type: object
      required: [id, user_id, name, platform, app_version, created_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        user_id: { $ref: '#/components/schemas/ID' }
        name: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    AuthResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
    DeleteUserRequest:
      type: object
      properties:
        photo_action:
          type: string
          enum: [retain, transfer]
          default: retain
          description: retain leaves a deleted-user tombstone and its photos intact; transfer moves the files and ownership to transfer_to_user_id and removes the account.
        transfer_to_user_id:
          anyOf:
            - $ref: '#/components/schemas/ID'
            - type: 'null'
          description: Required when photo_action is transfer; must identify another active user.
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, minLength: 12, maxLength: 256, format: password }
    Folder:
      type: object
      required: [id, owner_id, name, is_shared, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        owner_id: { $ref: '#/components/schemas/ID' }
        parent_id:
          anyOf:
            - $ref: '#/components/schemas/ID'
            - type: 'null'
        name: { type: string, minLength: 1, maxLength: 255 }
        is_shared: { type: boolean }
        inherited_permission:
          anyOf:
            - $ref: '#/components/schemas/Permission'
            - type: 'null'
        photo_count: { type: integer, minimum: 0 }
        child_folder_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parent_id:
          anyOf:
            - $ref: '#/components/schemas/ID'
            - type: 'null'
    RenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        conflict: { type: string, enum: [reject, rename], default: reject }
    MoveRequest:
      type: object
      required: [target_folder_id]
      properties:
        target_folder_id: { $ref: '#/components/schemas/ID' }
        conflict: { type: string, enum: [reject, rename], default: reject }
    Photo:
      type: object
      required: [id, owner_id, folder_id, filename, mime_type, size, checksum, captured_at, captured_at_source, indexed_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        owner_id: { $ref: '#/components/schemas/ID' }
        folder_id: { $ref: '#/components/schemas/ID' }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, video/mp4, video/webm] }
        size: { type: integer, format: int64, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        captured_at: { type: string, format: date-time }
        captured_at_source: { type: string, enum: [exif, file_mtime] }
        file_created_at: { type: string, format: date-time }
        indexed_at: { type: string, format: date-time }
        camera_make: { type: [string, 'null'] }
        camera_model: { type: [string, 'null'] }
        orientation: { type: [integer, 'null'], minimum: 1, maximum: 8 }
        focal_length: { type: [number, 'null'], minimum: 0 }
        aperture: { type: [number, 'null'], minimum: 0 }
        iso: { type: [integer, 'null'], minimum: 0 }
        gps_latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: WGS-84 capture latitude from EXIF GPS or the video container's ISO 6709 location; omitted when unknown }
        gps_longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: WGS-84 capture longitude; omitted when unknown }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_live_photo: { type: boolean, description: True when a validated motion companion exists; may be omitted by list endpoints before status enrichment. }
    PhotoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
    ThumbnailPending:
      type: object
      required: [status, retry_after_ms, photo_id]
      properties:
        status: { type: string, const: pending }
        retry_after_ms: { type: integer, minimum: 50 }
        photo_id: { $ref: '#/components/schemas/ID' }
    MapConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [tianditu] }
        tile_layers:
          type: array
          items: { $ref: '#/components/schemas/MapTileLayer' }
        min_zoom: { type: integer, minimum: 0 }
        max_zoom: { type: integer, minimum: 0 }
        attribution: { type: string }
        attribution_url: { type: string, format: uri }
    MapTileLayer:
      type: object
      required: [url, subdomains]
      properties:
        url: { type: string, description: 'Tile URL template with {s}, {z}, {x} and {y} placeholders' }
        subdomains: { type: string, description: 'One character per subdomain, substituted for {s}' }
    MapPoints:
      type: object
      required: [items, total_photos]
      properties:
        items:
          type: array
          description: '[photo id, latitude, longitude, captured_at]; coordinates rounded to six decimals'
          items:
            type: array
            minItems: 4
            maxItems: 4
            prefixItems:
              - { $ref: '#/components/schemas/ID' }
              - { type: number, minimum: -90, maximum: 90 }
              - { type: number, minimum: -180, maximum: 180 }
              - { type: string, format: date-time }
        total_photos: { type: integer, minimum: 0, description: Visible photos with or without a position }
    LivePhotoStatus:
      type: object
      required: [live_photo_ids]
      properties:
        live_photo_ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ID' }
    Share:
      type: object
      required: [id, resource_type, resource_id, user_id, permission, created_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        resource_type: { type: string, const: folder }
        resource_id: { $ref: '#/components/schemas/ID' }
        user_id: { $ref: '#/components/schemas/ID' }
        permission: { $ref: '#/components/schemas/Permission' }
        created_at: { type: string, format: date-time }
    CreateShareRequest:
      type: object
      required: [folder_id, user_id, permission]
      properties:
        folder_id: { $ref: '#/components/schemas/ID' }
        user_id: { $ref: '#/components/schemas/ID' }
        permission: { $ref: '#/components/schemas/Permission' }
    ManagedSharePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedShareLink' } }
        next_cursor: { type: string }
    ManagedShareLink:
      type: object
      required: [id, resource_type, resource_id, resource_name, created_at, expires_at, revoked_at, password_protected, status]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        resource_type: { type: string, enum: [photo, folder] }
        resource_id: { $ref: '#/components/schemas/ID' }
        resource_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        revoked_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        password_protected: { type: boolean }
        status: { type: string, enum: [active, expired, revoked, unavailable] }
    ShareLink:
      type: object
      required: [id, resource_type, resource_id, url, password_protected]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        resource_type: { type: string, enum: [photo, folder] }
        resource_id: { $ref: '#/components/schemas/ID' }
        url: { type: string, pattern: '^/#/share/' }
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        password_protected: { type: boolean }
    CreateShareLinkRequest:
      type: object
      required: [resource_type, resource_id, duration]
      additionalProperties: false
      properties:
        resource_type: { type: string, enum: [photo, folder] }
        resource_id: { $ref: '#/components/schemas/ID' }
        duration: { type: string, enum: [1_day, 7_days, forever] }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
    UnlockShareRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    PublicShare:
      type: object
      required: [resource_type, name, password_required]
      properties:
        resource_type: { type: string, enum: [photo, folder] }
        name: { type: string }
        folder_name: { type: string }
        folder_path: { type: string }
        password_required: { type: boolean }
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    PublicPhoto:
      type: object
      required: [id, folder_id, filename, mime_type, size, captured_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        folder_id: { $ref: '#/components/schemas/ID' }
        filename: { type: string }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, video/mp4, video/webm] }
        size: { type: integer, format: int64, minimum: 1 }
        captured_at: { type: string, format: date-time }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    PublicPhotoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicPhoto' }
    RescanJob:
      type: object
      required: [id, status, started_at, counts]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        status: { type: string, enum: [queued, running, completed, failed] }
        phase:
          type: string
          enum: [resetting, discovering, indexing, reconciling, thumbnails]
        total:
          type: integer
          minimum: 0
          description: Supported non-MOV files to process after discovery; MOV companions are processed with their still image.
        processed:
          type: integer
          minimum: 0
          description: Files indexed, failed, or paired as MP4 companions. Thumbnail completion is tracked by the job status.
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        counts:
          type: object
          required: [scanned, added, updated, missing, failed]
          properties:
            scanned: { type: integer, minimum: 0 }
            added: { type: integer, minimum: 0 }
            updated: { type: integer, minimum: 0 }
            missing: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        error: { type: [string, 'null'] }
    ConfirmRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }
    MaintenanceKind:
      type: string
      enum: [rescan, thumbnail_rebuild, import, cleanup, user_transfer, trash]
    MaintenanceActivity:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/MaintenanceKind' }
        job_id:
          $ref: '#/components/schemas/ID'
          description: Set for rescan, thumbnail_rebuild and import; poll the matching job endpoint.
    MaintenanceStatus:
      type: object
      required: [active]
      properties:
        active:
          anyOf:
            - $ref: '#/components/schemas/MaintenanceActivity'
            - type: 'null'
    ThumbnailRebuildRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [incremental, full]
          default: full
          description: Omitted or empty means full.
    ThumbnailRebuildJob:
      type: object
      required: [id, mode, status, started_at, counts]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        mode: { type: string, enum: [incremental, full] }
        status: { type: string, enum: [queued, running, completed, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        counts:
          type: object
          required: [total, processed, regenerated, failed]
          properties:
            total: { type: integer, minimum: 0 }
            processed: { type: integer, minimum: 0 }
            regenerated: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        error: { type: string }
    BrokenPhoto:
      type: object
      required: [id, filename, reason]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        filename: { type: string }
        reason: { type: string, enum: [missing, empty] }
    BrokenPhotoScanResult:
      type: object
      required: [scanned, broken, skipped, items]
      properties:
        scanned: { type: integer, minimum: 0 }
        broken: { type: integer, minimum: 0 }
        skipped:
          type: integer
          minimum: 0
          description: Photos not classified because their library root is unavailable or the original could not be inspected; never deleted.
        items:
          type: array
          items: { $ref: '#/components/schemas/BrokenPhoto' }
    BrokenPhotoCleanupRequest:
      type: object
      required: [confirm, ids]
      properties:
        confirm: { type: boolean, const: true }
        ids:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: '#/components/schemas/ID' }
          description: Photo IDs from a previous scan that the administrator confirmed.
    BrokenPhotoCleanupResult:
      type: object
      required: [scanned, found, deleted, failed, failures]
      properties:
        scanned: { type: integer, minimum: 0, description: Distinct IDs received }
        found: { type: integer, minimum: 0, description: IDs still broken at cleanup time }
        deleted: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failures:
          type: array
          items:
            type: object
            required: [id, code]
            properties:
              id: { $ref: '#/components/schemas/ID' }
              code:
                type: string
                enum: [NOT_FOUND, NOT_BROKEN, WRITE_FORBIDDEN, INTERNAL_ERROR]
                description: NOT_BROKEN means the photo was left untouched because it is no longer clearly broken.
    ImportRequest:
      type: object
      required: [source_path, user_id]
      properties:
        source_path:
          type: string
          default: .
          description: Directory relative to the photo root; empty means ".".
        user_id: { $ref: '#/components/schemas/ID' }
        organize_by_date: { type: boolean, default: false }
    ImportJob:
      type: object
      required: [id, status, source_path, user_id, organize_by_date, started_at, counts]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        status: { type: string, enum: [queued, running, completed, failed] }
        source_path: { type: string }
        user_id: { $ref: '#/components/schemas/ID' }
        organize_by_date: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        counts:
          type: object
          required: [scanned, moved, skipped, failed]
          properties:
            scanned: { type: integer, minimum: 0 }
            moved: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0, description: 'Files left in place: destination already exists, hidden or temporary files, and symlinks.' }
            failed: { type: integer, minimum: 0 }
        error: { type: string }
    HealthResponse:
      type: object
      required: [status, database, storage, media, request_id]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
        storage: { type: string, enum: [ok, unavailable] }
        media: { type: string, enum: [ok, unavailable], description: Availability of ffmpeg, ffprobe and heif-convert; ordinary health remains OK when only media tools are unavailable. }
        request_id: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      description: Stable machine-readable error code; clients should branch on this value, not message text.
      enum:
        - INVALID_CREDENTIALS
        - LOGIN_RATE_LIMITED
        - AUTH_REQUIRED
        - CSRF_INVALID
        - ADMIN_REQUIRED
        - READ_FORBIDDEN
        - WRITE_FORBIDDEN
        - SHARE_MANAGE_FORBIDDEN
        - NOT_FOUND
        - INVALID_REQUEST
        - INVALID_TIMESTAMP
        - INVALID_CURSOR
        - CURSOR_MISMATCH
        - CURSOR_EXPIRED
        - NAME_CONFLICT
        - DUPLICATE_PHOTO
        - FOLDER_NOT_EMPTY
        - FOLDER_DESCENDANT
        - RESCAN_IN_PROGRESS
        - THUMBNAIL_REBUILD_IN_PROGRESS
        - IMPORT_IN_PROGRESS
        - MAINTENANCE_IN_PROGRESS
        - RESET_CONFIRM_REQUIRED
        - INVALID_REBUILD_MODE
        - INVALID_IMPORT_SOURCE
        - INVALID_JSON
        - USER_NOT_FOUND
        - BATCH_TOO_LARGE
        - UPLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_MEDIA
        - PIXEL_LIMIT_EXCEEDED
        - USERNAME_TAKEN
        - USERNAME_INVALID
        - PASSWORD_INVALID
        - CURRENT_PASSWORD_INCORRECT
        - LAST_ADMIN
        - USER_TRANSFER_REQUIRED
        - USER_TRANSFER_INVALID
        - CONFIRMATION_REQUIRED
        - RANGE_NOT_SATISFIABLE
        - STORAGE_UNAVAILABLE
        - DATABASE_UNAVAILABLE
        - SETUP_COMPLETE
        - INTERNAL_ERROR
