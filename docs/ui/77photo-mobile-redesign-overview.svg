<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <style>
    .bg{fill:#f5f8fc}.phone{fill:#fff;stroke:#dfe7f1;stroke-width:2}.title{font:700 28px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.t{font:14px system-ui;fill:#64748b}.s{font:12px system-ui;fill:#64748b}.blue{fill:#1677ff}.soft{fill:#f5f7fa}.line{stroke:#e8edf3;stroke-width:1}.dark{fill:#090909}.white{fill:#fff}.folder{fill:#e8f1ff;stroke:#1677ff;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1600" height="1000"/>
<text x="48" y="62" class="title"><tspan fill="#1677ff">77</tspan>Photo · Android Mobile UI Redesign</text>
<text x="48" y="92" class="t">简洁 · 现代 · 专注照片管理 · 基于当前 mobile 功能范围</text>

<!-- phone helper repeated manually -->
<!-- Login -->
<g transform="translate(40 140)">
<rect class="phone" rx="30" width="230" height="650"/>
<text x="115" y="105" text-anchor="middle" class="title"><tspan fill="#1677ff">77</tspan>Photo</text>
<text x="115" y="133" text-anchor="middle" class="t">记录生活的每一刻</text>
<rect x="20" y="200" width="190" height="58" rx="14" class="soft"/><text x="40" y="226" class="s">服务器地址</text><text x="40" y="245" class="s">https://example.com</text>
<rect x="20" y="270" width="190" height="58" rx="14" class="soft"/><text x="40" y="305" class="t">用户名</text>
<rect x="20" y="340" width="190" height="58" rx="14" class="soft"/><text x="40" y="375" class="t">密码</text>
<rect x="20" y="420" width="190" height="52" rx="26" class="blue"/><text x="115" y="452" text-anchor="middle" class="white" style="font:700 15px system-ui">登录 →</text>
<text x="34" y="507" class="s">☑ 记住我</text>
<text x="115" y="685" text-anchor="middle" class="h">01 登录</text>
</g>

<!-- Gallery -->
<g transform="translate(300 140)">
<rect class="phone" rx="30" width="230" height="650"/>
<text x="20" y="42" class="h"><tspan fill="#1677ff">77</tspan>Photo</text><text x="195" y="42" class="h">⌕</text>
<text x="18" y="78" class="h">2026年9月</text>
<g fill="#dfeaf7">
<rect x="18" y="94" width="61" height="80" rx="8"/><rect x="84" y="94" width="61" height="80" rx="8"/><rect x="150" y="94" width="61" height="80" rx="8"/>
<rect x="18" y="179" width="61" height="80" rx="8"/><rect x="84" y="179" width="61" height="80" rx="8"/><rect x="150" y="179" width="61" height="80" rx="8"/>
<rect x="18" y="264" width="61" height="80" rx="8"/><rect x="84" y="264" width="61" height="80" rx="8"/><rect x="150" y="264" width="61" height="80" rx="8"/>
</g>
<text x="18" y="382" class="h">2026年8月</text>
<g fill="#e8eef5"><rect x="18" y="398" width="61" height="80" rx="8"/><rect x="84" y="398" width="61" height="80" rx="8"/><rect x="150" y="398" width="61" height="80" rx="8"/></g>
<line x1="0" x2="230" y1="575" y2="575" class="line"/>
<text x="28" y="610" class="s" fill="#1677ff">▣ 图库</text><text x="82" y="610" class="s">⇧ 上传</text><text x="142" y="610" class="s">□ 文件夹</text><text x="198" y="610" class="s">⚙</text>
<text x="115" y="685" text-anchor="middle" class="h">02 图库 / 时间线</text>
</g>

<!-- Viewer -->
<g transform="translate(560 140)">
<rect class="phone" rx="30" width="230" height="650"/>
<rect x="1" y="1" width="228" height="648" rx="29" class="dark"/>
<text x="18" y="42" class="white" style="font:16px system-ui">←　3 / 128</text>
<rect x="12" y="80" width="206" height="390" rx="4" fill="#cfd9e5"/>
<text x="115" y="275" text-anchor="middle" class="t">PHOTO / VIDEO</text>
<rect x="16" y="494" width="198" height="54" rx="10" fill="#181818"/>
<text x="30" y="526" class="white" style="font:14px system-ui">▧ ▧ ▧ ▧ ▧ ▧ ▧</text>
<text x="25" y="592" class="white" style="font:18px system-ui">⌯　♡　ⓘ　⌫</text>
<text x="115" y="685" text-anchor="middle" class="h">03 媒体查看器</text>
</g>

<!-- Upload -->
<g transform="translate(820 140)">
<rect class="phone" rx="30" width="230" height="650"/>
<text x="18" y="42" class="h">上传</text>
<rect x="18" y="78" width="194" height="155" rx="14" class="soft" stroke="#dbe6f3"/>
<text x="115" y="125" text-anchor="middle" class="title" fill="#1677ff">▧</text>
<text x="115" y="155" text-anchor="middle" class="t">选择照片或视频</text>
<rect x="65" y="180" width="100" height="36" rx="18" class="blue"/><text x="115" y="203" text-anchor="middle" class="white" style="font:12px system-ui">选择文件</text>
<text x="18" y="274" class="h">上传队列 (3)</text>
<g><rect x="18" y="295" width="42" height="42" rx="6" fill="#dfeaf7"/><text x="70" y="310" class="s">IMG_1234.jpg</text><text x="70" y="330" class="s">12.3 MB · 60%</text><rect x="70" y="338" width="120" height="4" rx="2" fill="#dbe7f7"/><rect x="70" y="338" width="72" height="4" rx="2" class="blue"/></g>
<g><rect x="18" y="365" width="42" height="42" rx="6" fill="#dfeaf7"/><text x="70" y="380" class="s">IMG_1235.jpg</text><text x="70" y="400" class="s">等待中</text></g>
<g><rect x="18" y="435" width="42" height="42" rx="6" fill="#dfeaf7"/><text x="70" y="450" class="s">IMG_1236.mov</text><text x="70" y="470" class="s">等待中</text></g>
<text x="115" y="685" text-anchor="middle" class="h">04 上传</text>
</g>

<!-- Folders -->
<g transform="translate(1080 140)">
<rect class="phone" rx="30" width="230" height="650"/>
<text x="18" y="42" class="h">文件夹</text><text x="190" y="42" class="h">⌕</text>
<g transform="translate(18 82)">
<g><rect width="194" height="64" rx="12" class="soft"/><rect x="12" y="16" width="34" height="28" rx="6" class="folder"/><text x="58" y="28" class="t">全部照片</text><text x="58" y="46" class="s">12,532 张</text></g>
<g transform="translate(0 74)"><rect width="194" height="64" rx="12" class="soft"/><rect x="12" y="16" width="34" height="28" rx="6" class="folder"/><text x="58" y="28" class="t">DCIM</text><text x="58" y="46" class="s">8,421 张</text></g>
<g transform="translate(0 148)"><rect width="194" height="64" rx="12" class="soft"/><rect x="12" y="16" width="34" height="28" rx="6" class="folder"/><text x="58" y="28" class="t">Camera</text><text x="58" y="46" class="s">3,210 张</text></g>
<g transform="translate(0 222)"><rect width="194" height="64" rx="12" class="soft"/><rect x="12" y="16" width="34" height="28" rx="6" class="folder"/><text x="58" y="28" class="t">Screenshots</text><text x="58" y="46" class="s">428 张</text></g>
</g>
<text x="115" y="685" text-anchor="middle" class="h">05 文件夹</text>
</g>

<!-- Settings -->
<g transform="translate(1340 140)">
<rect class="phone" rx="30" width="220" height="650"/>
<text x="18" y="42" class="h">设置</text>
<g transform="translate(15 82)">
<g><rect width="190" height="68" rx="12" class="soft"/><text x="18" y="28" class="t">连接设置</text><text x="18" y="48" class="s">服务器地址、账号等</text></g>
<g transform="translate(0 78)"><rect width="190" height="68" rx="12" class="soft"/><text x="18" y="28" class="t">局域网范围</text><text x="18" y="48" class="s">配置局域网 IP 范围</text></g>
<g transform="translate(0 156)"><rect width="190" height="68" rx="12" class="soft"/><text x="18" y="28" class="t">重新扫描</text><text x="18" y="48" class="s">扫描本地照片到库</text></g>
<g transform="translate(0 234)"><rect width="190" height="68" rx="12" class="soft"/><text x="18" y="28" class="t">通用设置</text><text x="18" y="48" class="s">主题、语言等</text></g>
<g transform="translate(0 312)"><rect width="190" height="68" rx="12" class="soft"/><text x="18" y="28" class="t">关于</text><text x="18" y="48" class="s">版本 v1.0.0</text></g>
</g>
<text x="110" y="685" text-anchor="middle" class="h">06 设置</text>
</g>

<!-- Secondary panels -->
<g transform="translate(70 840)">
<rect x="0" y="0" width="330" height="120" rx="18" class="phone"/><text x="18" y="30" class="h">连接设置</text><text x="18" y="58" class="s">服务器地址 · 用户名 · 密码</text><rect x="18" y="76" width="294" height="28" rx="14" class="blue"/><text x="165" y="95" text-anchor="middle" class="white" style="font:12px system-ui">保存</text>
<rect x="360" y="0" width="330" height="120" rx="18" class="phone"/><text x="378" y="30" class="h">局域网范围</text><text x="378" y="58" class="s">192.168.1.0/24　　⊖</text><text x="378" y="84" class="s">10.0.0.0/8　　　⊖</text><text x="575" y="105" class="s" fill="#1677ff">＋ 添加范围</text>
<rect x="720" y="0" width="330" height="120" rx="18" class="phone"/><text x="738" y="30" class="h">重新扫描</text><text x="738" y="58" class="s">扫描本地照片　　开始扫描</text><text x="738" y="86" class="s">重建缩略图　　　开始重建</text>
<rect x="1080" y="0" width="410" height="120" rx="18" class="phone"/><text x="1098" y="30" class="h">媒体详情</text><text x="1098" y="58" class="s">IMG_20260923_1234.jpg · 3.2 MB · 3024 × 4032</text><text x="1098" y="86" class="s">拍摄时间 · 文件路径 · 媒体类型</text>
</g>
</svg>