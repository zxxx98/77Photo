name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - mobile/package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check Android version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare package versions
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const current = JSON.parse(fs.readFileSync('mobile/package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(current)) throw new Error('Android version must be MAJOR.MINOR.PATCH');
          let previous;
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.BEFORE && !/^0+$/.test(process.env.BEFORE)) {
            try {
              previous = JSON.parse(execFileSync('git', ['show', `${process.env.BEFORE}:mobile/package.json`],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] })).version;
            } catch { /* The package did not exist before this push. */ }
          }
          const changed = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' || previous !== current;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\nversion=${current}\n`);
          console.log(`Android version: ${previous ?? '(new)'} -> ${current}; build: ${changed}`);
          NODE

  build:
    name: Build signed ARM64 release APK
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Check JavaScript
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --runInBand
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/77photo-release.keystore"
          test -s "$RUNNER_TEMP/77photo-release.keystore"
      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/77photo-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Verify signature and target ABI
        run: |
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)"
          if [[ "$abis" != arm64-v8a ]]; then
            echo "Release APK contains an unexpected target ABI: $abis" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION: ${{ needs.version.outputs.version }}
          ANDROID_TAG: android-${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          asset="$apk#77photo-android-$ANDROID_VERSION-arm64-release.apk"
          if gh release view "$ANDROID_TAG" >/dev/null 2>&1; then
            echo "Release $ANDROID_TAG already exists; replacing its APK."
            gh release upload "$ANDROID_TAG" "$asset" --clobber
          else
            notes="Signed ARM64 (arm64-v8a) release APK for 77Photo $ANDROID_VERSION. An existing installation can only be updated in place when it was signed with the same key."
            gh release create "$ANDROID_TAG" "$asset" \
              --title "77Photo Android $ANDROID_VERSION" \
              --notes "$notes"
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/77photo-release.keystore"
