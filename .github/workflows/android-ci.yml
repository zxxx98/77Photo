name: Android CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript checks
        run: |
          npm test -- --runInBand
          npm run typecheck
          npm run lint

      - name: Run Kotlin unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Detect Android version change
        id: version
        working-directory: .
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          current_version="$(node -p "require('./mobile/package.json').version")"
          previous_version=""

          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous_version="$(
              git show "$BASE_SHA:mobile/package.json" 2>/dev/null \
                | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).version));' \
                || true
            )"
          fi

          changed=false
          if [ -z "$previous_version" ] || [ "$current_version" != "$previous_version" ]; then
            changed=true
          fi

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Android version: $current_version (changed: $changed)"

      - name: Build debug APK for version change
        if: steps.version.outputs.changed == 'true'
        working-directory: mobile
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.current }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./android/gradlew assembleDebug

      - name: Upload versioned debug APK
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 77photo-android-${{ steps.version.outputs.current }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
