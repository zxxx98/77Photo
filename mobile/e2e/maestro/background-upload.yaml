appId: com.photo77
---
- launchApp:
    clearState: true
- tapOn: "服务器地址"
- inputText: "https://photo.test"
- tapOn: "显示名称"
- inputText: "测试图库"
- tapOn: "添加服务器"
- tapOn: "用户名"
- inputText: "admin"
- tapOn: "密码"
- inputText: "correct horse battery staple"
- tapOn: "安全登录"
- extendedWaitUntil:
    visible: "图库"
    timeout: 10000
- launchApp:
- tapOn: "上传"
- tapOn: "选择照片或视频"
- tapOn: "photo-1.jpg"
- tapOn: "添加"
- tapOn: "选择目标文件夹"
- tapOn: "旅行"
- tapOn: "开始上传"
- pressKey: HOME
- swipe:
    start: 50%, 0%
    end: 50%, 80%
- assertVisible: "Uploading photos"
- tapOn: "Pause"
- tapOn: "Resume"
- pressKey: BACK
- launchApp:
- tapOn: "上传"
- extendedWaitUntil:
    visible: "已完成"
    timeout: 30000
