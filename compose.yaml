services:
  77photo:
    build:
      context: .
    image: 77photo:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PHOTO_DATA_DIR: /data/photos
      PHOTO_CACHE_DIR: /data/cache
      PHOTO_DB_PATH: /data/database/77photo.db
      PHOTO_LISTEN_ADDR: :8080
      PHOTO_THUMBNAIL_WORKERS: "1"
      PHOTO_MAX_UPLOAD_SIZE: "10737418240"
      PHOTO_SESSION_TTL: 720h
      PHOTO_COOKIE_SECURE: "true"
    volumes:
      - photo-data:/data/photos
      - photo-cache:/data/cache
      - photo-database:/data/database

volumes:
  photo-data:
  photo-cache:
  photo-database:
