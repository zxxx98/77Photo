services:
  77photo:
    image: ${PHOTO_IMAGE:-ghcr.io/zxxx98/77photo:latest}
    restart: unless-stopped
    # The bind-mounted host directories may be owned by root.
    user: "0:0"
    ports:
      - "20001:8080"
    environment:
      PHOTO_DATA_DIR: /data/photos
      PHOTO_CACHE_DIR: /data/cache
      PHOTO_DB_PATH: /data/database/77photo.db
      PHOTO_LISTEN_ADDR: :8080
      PHOTO_THUMBNAIL_WORKERS: "2"
      PHOTO_MAX_UPLOAD_SIZE: "10737418240"
      PHOTO_SESSION_TTL: 720h
      PHOTO_MEDIA_TIMEOUT: 30s
      PHOTO_TRASH_RETENTION_DAYS: ${PHOTO_TRASH_RETENTION_DAYS:-30}
      # This compose file is exposed directly over HTTP on port 20001. Set
      # this to "true" only when an HTTPS reverse proxy fronts the service.
      PHOTO_COOKIE_SECURE: "false"
      # Tianditu browser key for the map page. Put it in a .env file next to
      # this compose file (ignored by Git); leave it unset to disable the map.
      PHOTO_FACE_ENABLED: ${PHOTO_FACE_ENABLED:-false}
      PHOTO_FACE_WORKER_URL: ${PHOTO_FACE_WORKER_URL:-}
      PHOTO_FACE_WORKER_TOKEN: ${PHOTO_FACE_WORKER_TOKEN:-}
      PHOTO_FACE_ALLOW_INSECURE_LAN: ${PHOTO_FACE_ALLOW_INSECURE_LAN:-false}
      PHOTO_FACE_MATCH_THRESHOLD: ${PHOTO_FACE_MATCH_THRESHOLD:-0.55}
      PHOTO_FACE_MATCH_MARGIN: ${PHOTO_FACE_MATCH_MARGIN:-0.08}
      PHOTO_FACE_CONCURRENCY: ${PHOTO_FACE_CONCURRENCY:-4}
      PHOTO_MAP_TIANDITU_KEY: ${PHOTO_MAP_TIANDITU_KEY:-}
    volumes:
      # Original photos and videos: HDD
      - /mnt/disk2/data/77Photo:/data/photos
      # Rebuildable thumbnail cache: SSD
      - /mnt/nvme/data/77Photo/cache:/data/cache
      # SQLite database: SSD
      - /mnt/nvme/data/77Photo/database:/data/database
